name: Publish Docker image to GHCR

on:
  push:
    branches: [main]

concurrency:
  group: deploy-ghcr
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  quality-checks:
    uses: ./.github/workflows/quality-checks.yml

  publish-image:
    name: Build and publish image
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set image name and tag
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$(jq -r '.version' package.json)" >> "$GITHUB_ENV"

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if the image already exists
        id: check
        run: |
          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::warning::Image $IMAGE already exists - skipping build and push"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
