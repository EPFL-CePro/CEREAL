services:
  cereal-app-db:
    extends:
      file: compose.base.yml
      service: cereal-app-db
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - cereal-app-network
    ports:
      - "3306:3306"
  cereal-app:
    extends:
      file: compose.base.yml
      service: cereal-app
    image: node:24
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - app-next:/app/.next
      - ${EXAM_FILES_UPLOAD_FOLDER}:${EXAM_FILES_UPLOAD_FOLDER}:rw
      - ${DEFFERED_EXAMS_DIR}:${DEFFERED_EXAMS_DIR}:rw
      - ${ARCHIVE_EXAMS_DIR}:${ARCHIVE_EXAMS_DIR}:rw
      - pnpm-store:/pnpm-store
    stdin_open: true
    tty: true
    command: /bin/sh -c "cd /app && corepack enable && pnpm install --store-dir /pnpm-store && pnpm dev"
    depends_on:
      cereal-app-db:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - EXAM_FILES_UPLOAD_FOLDER=${EXAM_FILES_UPLOAD_FOLDER}
      - DEFFERED_EXAMS_DIR=${DEFFERED_EXAMS_DIR}
    networks:
      - cereal-app-network
  cereal-app-pma:
    image: phpmyadmin
    container_name: cereal-app-pma
    restart: unless-stopped
    environment:
      - PMA_HOST=${MYSQL_HOST}
    depends_on:
      cereal-app-db:
        condition: service_healthy
    ports:
      - 8088:80
    networks:
      - cereal-app-network
  mailpit:
    image: axllent/mailpit
    container_name: cereal-mailpit
    restart: unless-stopped
    ports:
      - 8025:8025 # Web UI
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:587 # Same as send-mail.ts
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - cereal-app-network

volumes:
  pnpm-store:
  app-node-modules:
  app-next:

networks:
  cereal-app-network:
    name: cereal-app-network
