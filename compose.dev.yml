name: cereal-dev
services:
  mysql:
    extends:
      file: compose.base.yml
      service: mysql
    ports : ["127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"]

  mysql-init:
    extends:
      file: compose.base.yml
      service: mysql-init
    # No seed mounted: the dev dump is created and imported manually for now.
    # TODO(prisma): replace the manual dump with `prisma db seed`

  app:
    image: node:24
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    working_dir: /app
    ports: ["127.0.0.1:3000:3000"]
    user: "0:0"
    extends:
      file: compose.base.yml
      service: app
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - app-next:/app/.next
    environment:
      NODE_ENV: development
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    restart: "no"

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["127.0.0.1:8080:80"]

volumes:
  mysql-data:
  app-node-modules:
  app-next:

# TODO(secrets): enable once Ansible generates the files in SECRETS_DIR
